version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - APPLICATION_ID=local-dev
      - DB_SERVER=db
      - DB_USER=root
      - DB_PASSWORD=secret
      - DB_NAME=cloudframe
    depends_on:
      - db

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: cloudframe
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  test:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["vendor/bin/phpunit", "--configuration", "phpunit.xml.dist", "--coverage-text"]
    volumes:
      - .:/app

volumes:
  db_data:
